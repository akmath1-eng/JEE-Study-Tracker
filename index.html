  function updateCountdown(){if(!$('cd-days'))return;const diff=Math.max(0,new Date(state.settings.targetDate).getTime()-Date.now()),mins=Math.floor(diff/60000);$('cd-days').textContent=String(Math.floor(mins/1440)).padStart(2,'0');$('cd-hours').textContent=String(Math.floor(mins/60)%24).padStart(2,'0');$('cd-minutes').textContent=String(mins%60).padStart(2,'0');$('countdown-caption').textContent=diff===0?'TARGET REACHED · YOUR NEXT STEP AWAITS':'TIME TO YOUR TARGET'}

  function renderTests(){const series=[...new Set(allTests().filter(t=>!t.paperDate).map(t=>t.series))];return header('The test lab.','Plan the paper. Log the result. Close the gaps.',`<button class="btn" data-action="add-test">${icon('plus')}Add test</button>`)+`<div class="notice" style="margin-bottom:20px">62 scheduled papers from your two timetables. Shared Kota full mocks are merged. Marks default to 300 for Main/revision and are editable; Advanced totals must be entered. Some coaching coverage includes Adv topics — the syllabus tracker uses the official 2026 Main core.</div><div class="toolbar"><div class="search">${icon('search')}<input id="test-search" value="${esc(testSearch)}" placeholder="Search tests or topics…" aria-label="Search tests"></div><select id="test-filter" aria-label="Test status">${[['upcoming','Upcoming'],['all','All scheduled tests'],['completed','Completed'],['missed','Missed / retake'],['overdue','Past, unlogged'],['main','Main only'],['advanced','Advanced']].map(([v,l])=>`<option value="${v}" ${testFilter===v?'selected':''}>${l}</option>`).join('')}</select><select id="series-filter" aria-label="Test series"><option value="all">All series</option>${series.map(s=>`<option ${s===seriesFilter?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="btn secondary" data-action="new-attempt">${icon('test')}Log a result</button><button class="btn secondary" data-action="review-hub">${icon('brain')}Errors & skips</button></div><div class="flexrow between" style="margin-bottom:15px"><span class="small muted" id="test-count"></span><button class="textbutton" data-action="all-history">Attempt history ${icon('arrow')}</button></div><div id="test-list" class="test-list">${renderTestRows()}</div>`}

  function chapterListData(){const flagged=new Set(urgentRevisionQueue(syllabusTrack==='advanced'?'advanced':'main').map(q=>q.chapter.id));return CHAPTERS.filter(c=>c.subject===subject&&(!chapterSearch||(c.name+' '+c.group+' '+[...c.topics,...customTopics(c.id).map(t=>t.title)].join(' ')).toLowerCase().includes(chapterSearch.toLowerCase()))).filter(c=>{const p=syllabusTrack==='advanced'?advancedChapterStats(c):chapterCompletion(c),d=dueDate(c.id);return chapterFilter==='all'||(chapterFilter==='after-main'&&advancedTiming(c.id)==='afterMain')||(chapterFilter==='alongside'&&advancedTiming(c.id)==='alongside')||(chapterFilter==='not-started'&&p.done===0)||(chapterFilter==='progress'&&p.done>0&&p.done<p.total)||(chapterFilter==='complete'&&p.done===p.total)||(chapterFilter==='backlog'&&/backlog|pending|incomplete/i.test(chapterPlan(c)))||(chapterFilter==='extras'&&c.legacy)||(chapterFilter==='skipped'&&skipAlerts().some(x=>x.chapter.id===c.id))||(chapterFilter==='priority'&&flagged.has(c.id))||(chapterFilter==='due'&&d&&d<=today())})}
  function renderChapterRows(){const cs=chapterListData(),flagged=new Set(urgentRevisionQueue(syllabusTrack==='advanced'?'advanced':'main').map(q=>q.chapter.id));let group='';return cs.length?cs.map(c=>{let h='';if(c.group!==group){group=c.group;h=`<div class="subject-head"><span class="eyebrow">${esc(group)}</span><div class="line"></div><span class="small muted">${cs.filter(x=>x.group===group).length}</span></div>`}const p=progressOf(c.id),advDone=advancedChapterStats(c).done,stats=syllabusTrack==='advanced'?advancedChapterStats(c):chapterCompletion(c),r=lastRecall(c.id),due=dueDate(c.id);return h+`<details class="chapter ${flagged.has(c.id)?'flagged':skipInfo(c.id).tests.size>=state.settings.skipThreshold?'skipped':''}" id="chapter-${c.id}"><summary><span class="chapter-num mono">${String(CHAPTERS.filter(x=>x.subject===subject).indexOf(c)+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(c.name)}</h3><div class="chapter-sub">${syllabusTrack==='advanced'?'Adv depth · '+(advancedTiming(c.id)==='afterMain'?'After Main':'Alongside Main')+' · ':''}${c.legacy?'<span class="badge">Adv</span> ':''}${skipInfo(c.id).count?'<span class="accent">'+skipInfo(c.id).count+' Qs skipped · '+skipInfo(c.id).tests.size+' tests</span> · ':''}${syllabusTrack==='advanced'?advDone+'/'+advancedChapterStats(c).total+' Advanced checks':(c.topics.length+customTopics(c.id).length)+' topics · '+p.years.filter(y=>activeYears().includes(y)).length+'/'+activeYears().length+' PYQ years'} ${r?'· Recall '+fmtDate(r.date,{day:'numeric',month:'short'}):'· No recall yet'}</div></div>${flagged.has(c.id)?'<span class="badge red">Priority</span>':skipInfo(c.id).tests.size>=state.settings.skipThreshold?'<span class="badge amber">Skipped often</span>':due&&due<=today()?'<span class="badge blue">Recall due</span>':''}<div class="chapter-percent mono">${stats.pct}%<div class="progress"><span style="width:${stats.pct}%"></span></div></div>${icon('chevron','chevron')}</summary><div class="chapter-body">${sy   function chapterBody(c,p){const recalls=state.recalls.filter(r=>r.chapterId===c.id).reverse().sort((a,b)=>b.date.localeCompare(a.date)),flagged=priorityQueue().find(q=>q.chapter.id===c.id);return `${chapterPlanBlock(c)}${repeatedSkipNotice(c)}${flagged?`<div class="notice warning" style="margin-bottom:20px">${flagged.count} unresolved conceptual errors. Relearn the concept, redo the questions without help, then mark those mistakes resolved in the queue.</div>`:''}<div class="flexrow between wrap"><div class="eyebrow">01 / Topic coverage</div><button class="textbutton" data-action="add-topic" data-id="${c.id}">${icon('plus')}Add topic</button></div><div class="topic-grid">${topicCoverageRows(c,p)}</div>${topicArchiveBlock(c)}${chapterRevisionBlock(c)}<div class="eyebrow">02 / Notes & revision</div><div class="milestones">${[['notes','Notes completed'],['short','Short notes / formula sheet ready'],['revision','1st revision done']].map(([k,l])=>`<label class="checklabel"><input type="checkbox" data-progress="${k}" data-id="${c.id}" ${p[k]?'checked':''}><span>${l}</span></label>`).join('')}</div><div class="flexrow between wrap"><div class="eyebrow">03 / Chapter PYQs</div><div class="flexrow"><button class="textbutton" data-action="all-years" data-id="${c.id}">${activeYears().every(y=>p.years.includes(y))?'Reset included':'Mark all mastered'}</button><button class="textbutton" data-action="years">Manage years</button></div></div>${pyqYears(c,p)}<div class="flexrow between wrap"><div><div class="eyebrow">04 / Active recall</div><div class="hint">Close the notes. Reproduce the ideas. Check the gaps.</div></div><button class="btn secondary compact" data-action="recall" data-id="${c.id}">${icon('brain')}Log recall</button></div><div class="hint">${dueDate(c.id)?'Next spaced review: '+fmtDate(dueDate(c.id)):'Log a revision or recall to start 3 / 7 / '+state.learning.longGap+' day reminders.'}</div>${recalls.slice(0,5).map(r=>`<div class="recall-row"><div class="flexrow bet   function renderPapers(){const papers=PRESETS.filter(t=>t.paperDate&&(paperSession==='all'||(paperSession==='jan'?t.paperDate.includes('-01-'):t.paperDate.includes('-04-')))),done=PRESETS.filter(t=>t.paperDate&&attempts(t.id).length).length;return header('The 2026 paper vault.','Real shifts. Fresh attempts. Your next benchmark.',`<span class="pill">20 mock slots</span>`)+`<div class="notice" style="margin-bottom:20px">19 shifts are verified against NTA records. The requested 8 April Shift 1 is an additional custom slot: NTA lists only Shift 2 for April 8. These are mock log slots; questions are not embedded. Selected April cards link directly to NTA PDFs; the others open the official document archive. Use a paper you have access to and record your actual attempt date.</div><div class="toolbar"><div class="segmented">${[['all','All 20 slots'],['jan','January · 10'],['apr','April · 10']].map(([v,l])=>`<button class="${paperSession===v?'active':''}" data-action="paper-session" data-value="${v}">${l}</button>`).join('')}</div><span class="list-count">${done} / 20 papers attempted</span></div><div class="paper-grid">${papers.map(t=>{const a=attempts(t.id),last=a[0];return `<article class="card paper-card"><div class="flexrow between"><div class="paper-monogram">${t.paperDate.includes('-01-')?'JAN':'APR'}</div><span class="badge ${last?'green':''}">${t.unverified?'Custom slot':last?'Attempted':'Ready to attempt'}</span></div><h3>${esc(t.name)}</h3><p>Paper 1 · 300 marks · 180 min</p><p style="margin-top:4px">Original slot: ${t.time}–${t.time==='09:00'?'12:00':'18:00'}</p>${last?`<div class="score-block mono" style="text-align:left;margin-top:18px"><b>${last.score}</b><span> / ${last.total}</span><p class="small muted" style="margin-top:5px">Last attempt ${fmtDate(last.date)}</p></div>`:''}<button class="btn ${last?'secondary':''}" data-action="attempt" data-id="${t.id}">${icon('plus')}${last?'Log a retake':'Log this mock'}</button>${t.unverified?'<p class="hint" style="margin-top:12px">User-requested slot. Supply your own paper; an official Shift 1 is not verified.</p>':`<a class="paperlink" href="${t.url}" target="_blank" rel="noopener noreferrer">${t.url.endsWith('.pdf')?'Open official question paper':'Open NTA document archive'} ↗</a>`}${last?`<button class="textbutton" style="width:100%" data-action="history" data-id="${t.id}">Review ${a.length} attempt${a.length===1?'':'s'}</button>`:''}</article>`}).join('')}</div>`}
  function renderSettings(){return header('Make it yours.','Your target, your data, your rhythm.')+`<div class="grid settings-layout"><div class="stack"><section class="card settings-card"><h2>Your Main target</h2><p>The default Main planning date is 22 January 2027. Update it when your actual exam slot is confirmed; the pace tracker follows this date. Times use this device’s local timezone.</p><form id="settings-form"><div class="form-grid"><div><label class="label" for="target-date">Target date & time</label><input id="target-date" type="datetime-local" name="targetDate" required value="${state.settings.targetDate}"></div><div><label class="label" for="target-score">Main target /300</label><input id="target-score" type="number" min="1" max="300" step="1" required name="targetScore" value="${state.settings.targetScore}"></div></div><div class="subject-scores" style="grid-template-columns:repeat(3,1fr);margin:20px 0">${SUBJECTS.map(s=>`<div><label class="label" for="target-${s}">${s==='Mathematics'?'Maths':s} /100</label><input id="target-${s}" type="number" required min="0" max="100" step="1" name="${s}" value="${state.settings.subjectTargets[s]}"></div>`).join('')}</div><p class="hint" style="margin-bottom:16px">Your Masterplan targets 90 Physics + 90 Chemistry + 70 Maths = 250. Marks do not imply a fixed percentile.</p><button class="btn" type="submit">Save targets ${icon('check')}</button></form></section><section class="card settings-card"><div class="sectionhead"><h2>Choose your PYQ years</h2><span class="badge">${activeYears().length} included</span></div><p>Uncheck a year to ignore it everywhere. Its saved progress stays intact, and it no longer counts toward readiness.</p>${yearControls()}<div class="hint">Masterplan emphasis: Physics 2019, 2020, 2021, 2025; Physical Chemistry 2021, 2022, 2023, 2025. The global filter applies equally to every chapter.</div></section><section class="card settings-card"><h2>Your Advanced target</h2><p>${state.settings.advanced.targetScore} /${state.settings.advanced.maxScore} · ${state.settings.advanced.targetDate?fmtDate(state.settings.advanced.targetDate.slice(0,10)):'planning date not set'}. Main and Advanced checklists are independent; study Advanced alongside Main or defer individual chapters.</p><button class="btn secondary" data-action="advanced-target">Edit Advanced target</button><button class="textbutton" style="margin-left:16px" data-action="track-advanced">Open Adv depth plan</button></section>${learningSettings()}${reminderSettings()}<section class="card settings-card"><h2>Your data, in your hands</h2><p>Everything is stored in this browser on this device and website address. Safari and a Home Screen app may keep separate stores. JSON export/import transfers progress between them. iPad storage can be cleared by the OS; keep backups.</p><div class="flexrow wrap"><button class="btn" data-action="export">${icon('download')}Export JSON</button><button class="btn secondary" data-action="export-compressed">Export compressed</button><button class="btn secondary" data-action="import">${icon('upload')}Import JSON</button></div><div class="health">${storageOK?'✓ Browser saving is available. Backups can be exported as JSON or compressed gzip.':'Browser saving needs attention.'} ${state.sessions.length} attempts · ${state.recalls.length} recalls</div><div class="rule"></div><button class="btn ghost compact" data-action="raw-export">Export raw browser recovery file</button><p class="hint" style="margin-top:10px">Import validates the whole file before replacing anything and downloads a backup first. Reset clears only JEE Tracker’s data.</p></section></div><div class="stack"><section class="card settings-card"><div class="flexrow" style="margin-bottom:14px"><span class="badge green">${icon('bolt')} BUILT FOR FOCUS</span></div><h2>Feels at home on iPad.</h2><p>1. Upload this HTML as <b>index.html</b> to a GitHub repository.<br>2. In repository Settings → Pages, publish the branch containing it.<br>3. Open the HTTPS Pages URL in Safari.<br>4. Tap Share → Add to Home Screen → Add.</p><div class="notice">Single file. No build step. No account needed.<br><br>Home Screen launches in standalone mode with a custom JEE Tracker icon. This edition has no offline service worker; Chart.js and Tailwind load from CDNs. Core styling and tracking code are embedded, but a full offline install needs extra files.</div><button class="textbutton" data-action="help">Read the quick guide ${icon('arrow')}</button></section><section class="card settings-card"><h2>How the numbers work</h2><p><b>Main readiness:</b> checked core topics, notes, short notes, first revision and weighted PYQ-year progress (Practised ½, Mastered 1). Adv-labelled chapters and Adv-only topics are excluded. Advanced depth has four independent milestones per chapter, with timing set to After Main or Alongside Main.<br><br><b>Main score cards:</b> include Main mocks, part tests and weekly revision. Scores are scaled to /300; Advanced scores are excluded. Main charts use /300. Advanced analytics uses your configured Advanced maximum. Combined trajectories have separate axes; the weekly Main ramp stays independent.<br><br><b>Subject bars:</b> averages from complete P/C/M score breakdowns, scaled to /100.<br><br><b>Priority queue:</b> conceptual gaps or repeated skipping in at least three distinct tests trigger urgent attention. Main dashboard priorities use Main-test evidence; the global revision queue also covers Advanced. Resolved entries remain in history.<br><br><b>Streak:</b> consecutive local calendar days with a recall log or revision recorded. Yesterday’s streak stays alive until today ends.<br><br><b>Recall suggestions:</b> 3, 7 and 14 or 21 days after a logged revision. Confidence ratings remain a self-assessment. These are planning intervals. Main and Advanced depth checklists are independent; the dated pace tracker counts Main checkpoints, not individual questions.</p></section><section class="card settings-card"><h2>Source notes</h2><p>Schedules: your Normal plan and STAR SCORE-I PDFs. Preparation guidance and target: your Masterplan. Shared Kota mocks on Jan 6, 10, 13, 18 are merged. The Jan 18 AIOT label differs between plans; STAR timing is retained. A teaching-range year typo in the Normal plan is not used as a test date.<br><br>Baseline: the official 2026 NTA Main Paper 1 syllabus (20 Physics + 20 Chemistry + 14 Mathematics units), organised into ${CHAPTERS.length} chapter trackers matching your reference, including labelled extras. For a 2027 attempt, check the new official syllabus when published. Adv-labelled chapters do not count toward Main readiness; Advanced depth is tracked separately.</p><a class="small" href="https://jeemain.nta.nic.in/document/syllabus-2026/" target="_blank" rel="noopener noreferrer">NTA syllabus ↗</a><br><a class="small" href="https://jeemain.nta.nic.in/documents/" target="_blank" rel="noopener noreferrer">NTA papers & date/shift records ↗</a></section><section class="card settings-card" style="border-color:#ff948d33"><h2>Start fresh</h2><p>Delete your logged tests, mistakes, recall history, study sessions, habits, to-dos, checklists and settings. The built-in chapters and original schedule will be restored.</p><button class="btn red" data-action="reset">${icon('refresh')}Reset JEE Tracker data</button></section></div></div><div class="footer-note">JEE TRACKER · Single-file edition 6.1 · A clear plan for the days ahead.</div>`}
  function yearControls(){return `<div class="years">${YEARS.map(y=>`<label class="year ${activeYears().includes(y)?'':'ignored'}"><input type="checkbox" data-year-toggle="${y}" ${activeYears().includes(y)?'checked':''}>${y}</label>`).join('')}</div>`}
  function openModal(title,body,foot=''){saveModalDraft();$('modal').dataset.kind='';modalReturn=document.activeElement;const d=$('modal');d.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;if(!d.open){d.showModal();document.body.style.overflow='hidden'}d.scrollTop=0;if($('strategy-enabled')?.checked)updateStrategyPreview();setupModalDraft();enhanceTables(d)}
  function closeModal(){saveModalDraft();draftKey='';clearTimeout(draftTimer);const d=$('modal');d.close();document.body.style.overflow='';modalReturn?.isConnected&&modalReturn.focus()}
  const cancelButton=()=>'<button class="btn ghost" type="button" data-action="close">Cancel</button>';
  function selectTest(){const groups=[['Scheduled tests',allTests().filter(t=>!t.paperDate&&t.source!=='Custom test').sort((a,b)=>a.scheduled.localeCompare(b.scheduled))],['2026 papers',PRESETS.filter(t=>t.paperDate)],['Your tests',state.tests.filter(t=>t.kind!=='Board')]];openModal('Log a test result',`<form id="choose-test-form"><label class="label" for="choose-test">Which paper did you attempt?</label><select id="choose-test" name="testId" required><option value="">Choose a paper…</option>${groups.filter(x=>x[1].length).map(([name,tests])=>`<optgroup label="${name}">${tests.map(t=>`<option value="${t.id}">${esc(t.name)}${t.scheduled?' · '+fmtDate(t.scheduled):''}</option>`).join('')}</optgroup>`).join('')}</select><p class="hint">Can’t find your paper? Close this dialog and use Add Test in the Test Lab.</p></form>`,cancelButton()+'<button class="btn" form="choose-test-form" type="submit">Continue '+icon('arrow')+'</button>')}
  function testEditor(id){editingTest=id||null;const t=id?state.tests.find(t=>t.id===id):null;if(id&&!t)return;openModal(t?'Edit your test':'Add a custom test',`<form id="test-form"><div class="form-grid"><div class="full"><label class="label" for="test-name">Test name</label><input id="test-name" name="name" required maxlength="120" value="${esc(t?.name||'')}" placeholder="e.g. My full syllabus mock 01"></div><div><label class="label" for="test-kind">Pattern</label><select id="test-kind" name="kind">${KINDS.map(k=>`<option ${t?.kind===k?'selected':''}>${k}</option>`).join('')}</select></div><div><label class="label" for="test-series">Series / provider</label><input id="test-series" name="series" maxlength="50" required value="${esc(t?.series||'My Tests')}"></div><div><label class="label" for="test-date">Planned date (optional)</label><input id="test-date" name="scheduled" type="date" value="${t?.scheduled||''}"></div><div><label class="label" for="test-time">Planned time (optional)</label><input id="test-time" name="time" type="time" value="${t?.time||''}"></div>${SUBJECTS.map(s=>`<div class="full"><label class="label" for="coverage-${s}">${s} coverage</label><textarea id="coverage-${s}" name="${s}" maxlength="1500" placeholder="Full syllabus, or list your chapters…">${esc(t?.coverage[s]||'Full syllabus')}</textarea></div>`).join('')}</div><div id="form-error" class="error-msg" role="alert"></div></form>`,`${t?`<button class="btn red" style="margin-right:auto" data-action="delete-test" data-id="${t.id}">${icon('trash')}Delete</button>`:''}${cancelButton()}<button class="btn" form="test-form" type="submit">Save test ${icon('check')}</button>`)}
  function attemptEditor(testId,sessionId){const t=testById(testId);if(!t)return;editingSession=sessionId||null;const a=sessionId?state.sessions.find(s=>s.id===sessionId):null,total=a?.total??(isMain(t)?300:''),max=total?Math.round(total/3*100)/100:'';draftMistakes=a?JSON.parse(JSON.stringify(a.mistakes)):[];openModal(a?'Edit test attempt':'Log your attempt',`<div class="flexrow wrap"><span class="badge green">${esc(t.series)}</span><span class="badge">${esc(t.kind)}</span></div><h3 style="font-size:17px;margin:15px 0 7px">${esc(t.name)}</h3><p class="small muted" style="margin-bottom:22px">Record the date you actually took the paper. Negative marks are supported.</p><form id="attempt-form" data-test-id="${t.id}"><div class="form-grid"><div><label class="label" for="attempt-date">Attempt date</label><input id="attempt-date" name="date" type="date" max="${today()}" value="${a?.date||today()}" required></div><div><label class="label" for="attempt-minutes">Time taken (minutes)</label><input id="attempt-minutes" name="minutes" type="number" min="1" max="1440" step="1" value="${a?.minutes||180}" required></div><div><label class="label" for="attempt-total">Total marks</label><input id="attempt-total" name="total" type="number" min="1" max="2000" step="0.01" value="${total}" placeholder="Enter the paper’s maximum" required></div><div><label class="label" for="attempt-score">Scored marks</label><input id="attempt-score" name="score" type="number" step="0.01" value="${a?.score??''}" placeholder="Your score, including negatives" required></div><div class="full"><label class="label" for="attempt-percentile">Reported percentile (optional)</label><input id="attempt-percentile" name="percentile" type="number" min="0" max="100" step="0.0000001" value="${a?.percentile??''}" placeholder="From the provider / official result"><p class="hint">Enter only a reported percentile. Marks are never converted into an estimated percentile.</p></div></div><details class="coverage" ${a&&Object.keys(a.subjects).length?'open':''} style="margin-top:20px"><summary style="color:var(--accent);font-size:12px;min-height:44px">Subject breakdown (optional, powers your bar chart)</summary><div class="subject-scores"><span></span><span class="label">Scored</span><span class="label">Maximum</span>${SUBJECTS.map(s=>`<label for="sub-score-${s}">${s==='Mathematics'?'Maths':s}</label><input id="sub-score-${s}" name="score-${s}" type="number" step="0.01" placeholder="—" value="${a?.subjects[s]?.score??''}" aria-label="${s} scored marks"><input id="sub-max-${s}" name="max-${s}" type="number" min="0.01" max="2000" step="0.01" value="${a?.subjects[s]?.max??max}" aria-label="${s} maximum marks">`).join('')}</div><p class="hint">Leave all three scored fields empty to skip. If entered, all three subject scores and maxima must add up to the overall score and maximum.</p></details>${subjectTimeFields(a)}${strategyEditor(a)}<div class="rule"></div><div class="flexrow between wrap"><div><h3 style="margin:0">Mistake analysis</h3><p class="hint">One entry per missed or skipped question.</p></div><button class="btn secondary compact" type="button" data-action="add-draft">${icon('plus')}Add mistake</button></div><div id="draft-empty" class="hint ${draftMistakes.length?'hidden':''}" style="padding:15px 0">No mistakes logged yet. Add the chapter and error category to make revision specific.</div><div id="mistake-drafts">${draftMistakes.map(m=>mistakeDraft(m)).join('')}</div><div class="rule"></div><label class="label" for="attempt-note">Test reflection & next action</label><textarea id="attempt-note" name="note" maxlength="4000" placeholder="What worked? Where did the time go? What will you change next time?">${esc(a?.note||'')}</textarea><div id="form-error" class="error-msg" role="alert"></div></form>`,cancelButton()+`<button class="btn" form="attempt-form" type="submit">Save ${a?'changes':'attempt'} ${icon('check')}</button>`)}
  function mistakeDraft(m){const c=chapterById(m.chapterId),sub=c?.subject||'Physics';return `<div class="mistake-editor" data-mistake-id="${esc(m.id)}"><div class="flexrow between" style="margin-bottom:12px"><span class="eyebrow">Question review</span><button class="iconbtn" type="button" data-action="remove-draft" aria-label="Remove mistake">${icon('trash')}</button></div><div class="form-grid"><div><label class="label">Subject<select data-mistake-field="subject">${SUBJECTS.map(s=>`<option ${sub===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div><label class="label">Chapter<select data-mistake-field="chapterId" required>${chapterOptions(sub,m.chapterId)}</select></label></div><div><label class="label">Error category<select data-mistake-field="type">${ERROR_TYPES.map(t=>`<option ${m.type===t?'selected':''}>${t}</option>`).join('')}</select></label></div><div><label class="label">Question no. / identifier<input data-mistake-field="question" maxlength="100" placeholder="e.g. Q12" value="${esc(m.question||'')}"></label></div><div class="full"><label class="label">Why it happened / how to fix it<textarea data-mistake-field="note" maxlength="2000" placeholder="The exact concept or habit to repair…">${esc(m.note||'')}</textarea></label></div><label class="checklabel full"><input type="checkbox" data-mistake-field="resolved" ${m.resolved?'checked':''}><span>Resolved after redoing the question unaided</span></label></div></div>`}
  function chapterOptions(sub,selected){return '<option value="">Choose chapter…</option>'+CHAPTERS.filter(c=>c.subject===sub).map(c=>`<option value="${c.id}" ${selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
  function readMistakeDrafts(){return [...document.querySelectorAll('#mistake-drafts .mistake-editor')].map(row=>{const get=k=>row.querySelector(`[data-mistake-field="${k}"]`);return {id:row.dataset.mistakeId,chapterId:get('chapterId').value,type:get('type').value,question:get('question').value.trim(),note:get('note').value.trim(),resolved:get('resolved').checked}})}
  function recallEditor(id){const c=chapterById(id);openModal('Train your active recall',`<div class="badge green">${c.subject}</div><h3 style="font-size:17px">${esc(c.name)}</h3><p class="small muted" style="margin-bottom:22px">Try a blank-page summary or explain the chapter aloud without your notes. Rate what you could actually retrieve.</p><form id="recall-form" data-chapter-id="${id}"><div class="form-grid"><div><label class="label" for="recall-date">Recall date</label><input id="recall-date" type="date" name="date" value="${today()}" max="${today()}" required></div><div><label class="label" for="recall-confidence">Confidence after checking</label><select id="recall-confidence" name="confidence">${['1 · Could barely recall','2 · Major gaps','3 · Partial recall','4 · Mostly independent','5 · Clear and fluent'].map((s,i)=>`<option value="${i+1}" ${i===2?'selected':''}>${s}</option>`).join('')}</select></div><div class="full"><label class="label" for="recall-note">What did you recall? What did you miss?</label><textarea id="recall-note" name="note" maxlength="2000" placeholder="Write specific gaps and one next action…"></textarea></div></div><div id="form-error" class="error-msg" role="alert"></div></form>`,cancelButton()+'<button class="btn" form="recall-form" type="submit">Save recall '+icon('brain')+'</button>')}
  function recallHistory(id){const c=chapterById(id),logs=state.recalls.filter(r=>r.chapterId===id).reverse().sort((a,b)=>b.date.localeCompare(a.date));openModal(esc(c.name),logs.length?logs.map(r=>`<div class="recall-row"><div class="flexrow between"><span>${fmtDate(r.date)} · <span class="accent">${r.confidence}/5 confidence</span></span><button class="iconbtn" data-action="delete-recall" data-id="${r.id}" aria-label="Delete recall">${icon('trash')}</button></div><p>${esc(r.note||'No written reflection.')}</p></div>`).join(''):empty('brain','No recall sessions yet.','Log a recall from the chapter tracker.'),'<button class="btn secondary" data-action="close">Done</button>')}
  function history(testId){const logs=state.sessions.filter(a=>activeTest(a.testId)&&(!testId||a.testId===testId)).sort((a,b)=>b.date.localeCompare(a.date));openModal(testId?esc(testById(testId).name):'All attempt history',logs.length?logs.map(a=>`<article class="session-log"><div class="flexrow between wrap"><div><h3 style="margin:0">${esc(testById(a.testId).name)}</h3><p class="hint">${fmtDate(a.date)} · ${a.minutes} min · ${testById(a.testId).kind}${a.percentile===null||a.percentile===undefined?'':' · '+a.percentile+' %ile'}</p></div><span class="mono"><b style="font-size:22px">${a.score}</b><span class="muted"> /${a.total}</span></span></div>${Object.keys(a.subjects).length?`<p class="hint">${SUBJECTS.map(s=>`${s==='Mathematics'?'M':s[0]} ${a.subjects[s].score}/${a.subjects[s].max}`).join(' · ')}</p>`:''}${a.note?`<p class="small muted" style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px">${esc(a.note)}</p>`:''}${subjectTimeReport(a)}${attemptStrategyReport(a)}${a.mistakes.map(m=>mistakeLogRow(m,a)).join('')}<div class="flexrow wrap" style="margin-top:15px"><button class="btn secondary compact" data-action="edit-attempt" data-id="${a.id}">Edit attempt</button><button class="btn ghost compact" data-action="delete-attempt" data-id="${a.id}">${icon('trash')}Delete</button><button class="btn ghost compact" data-action="skip-log" data-test-id="${a.testId}">Log skipped Qs</button><span class="small muted">${a.mistakes.filter(m=>!m.resolved).length} open mistakes</span></div></article>`).join(''):empty('test','Your history starts here.','Save a test attempt to review it.'),'<button class="btn secondary" data-action="close">Done</button>')}
  function mistakeLogRow(m,a){const c=chapterById(m.chapterId);return `<div class="mistake-log-row ${m.resolved?'resolved':''}"><div class="flexrow between wrap"><span class="badge ${m.type==='Conceptual Gap'&&!m.resolved?'red':''}">${esc(m.type)}</span><span class="small muted">${esc(m.question||'Question not labelled')}</span></div><h3 style="margin-top:10px">${esc(c.name)}</h3>${m.note?`<p>${esc(m.note)}</p>`:''}${mistakeReminderControls(m,a)}<label class="checklabel" style="font-size:11px;padding-bottom:0"><input type="checkbox" data-resolve="${esc(m.id)}" data-session-id="${a.id}" ${m.resolved?'checked':''}><span>${m.resolved?'Resolved — history preserved':'Mark resolved after an unaided redo'}</span></label></div>`}
  // Skips are separate from wrong answers: one row can represent several unattempted questions.
  function skipInfo(id){const rows=state.skips.filter(k=>activeTest(k.testId)&&k.chapterId===id&&!k.resolved);return {rows,count:rows.reduce((n,k)=>n+k.count,0),tests:new Set(rows.map(k=>k.testId))}}
  function skipAlerts(){return CHAPTERS.map(chapter=>({chapter,...skipInfo(chapter.id)})).filter(x=>x.tests.size>=state.settings.skipThreshold).sort((a,b)=>b.tests.size-a.tests.size||b.count-a.count)}
  function skipAlertSummary(){const list=skipAlerts();return list.length?`<div class="notice amber" style="margin-top:14px">${list.length} chapter${list.length===1?' is':'s are'} repeatedly skipped across ${state.settings.skipThreshold}+ tests. <button class="textbutton" data-action="review-hub" data-tab="skips">Review skipped questions ${icon('arrow')}</button></div>`:''}

  function renderAnalytics(){const m=analyticsModel(),eligible=CHAPTERS.filter(c=>!c.legacy),study=state.studySessions.filter(x=>analyticsDate(x.date));return header('Understand your preparation.','Fourteen useful views, backed by your own data.',`<button class="btn secondary" data-action="new-attempt">${icon('plus')}Log test</button>`)+`<div class="toolbar analytics-toolbar"><select id="analytics-pattern" aria-label="Analytics pattern">${[['main','Main only'],['advanced','Advanced only'],['all','All patterns']].map(([v,l])=>`<option value="${v}" ${analyticsPattern===v?'selected':''}>${l}</option>`).join('')}</select><select id="analytics-series" aria-label="Analytics series"><option value="all">All series</option>${['STAR Score','Normal / ALLEN','2026 Papers','My Tests'].map(x=>`<option ${analyticsSeries===x?'selected':''}>${x}</option>`).join('')}</select><select id="analytics-range" aria-label="Analytics date range">${[['all','All time'],['14','Last 14 days'],['30','Last 30 days'],['90','Last 90 days']].map(([v,l])=>`<option value="${v}" ${analyticsRange===v?'selected':''}>${l}</option>`).join('')}</select><span class="list-count">${m.logs.length} test attempts</span></div><div class="notice" style="margin-bottom:22px">Main uses /300; Advanced uses your configured Advanced maximum (${state.settings.advanced.maxScore}). Combined trajectories have separate Main and Advanced axes; the other combined score comparisons use percentage of each paper’s maximum. Percentiles are reported values only. Syllabus charts show your current snapshot; study and habit charts follow the date range independently of paper filters.</div><div class="grid metrics">${metric('test','Attempts in view',m.logs.length,'Each retake counts as an attempt')}${analyticsAverageCards(m)}${metric('clock','Study logged',displayMinutes(study.reduce((n,x)=>n+x.minutes,0)),'Study sessions in the selected date range')}</div>${analyticsPattern==='main'?pacePanel():''}${strategyAnalyticsBlock(m)}<div class="sectionhead"><h2>What your data suggests</h2><span class="badge">Actionable, not predictive</span></div><div class="grid insight-grid" style="margin-bottom:24px">${analyticalInsights(m).map(x=>`<article class="subtle"><span class="badge ${x.kind}">${x.title}</span><p class="small muted" style="margin-top:12px">${esc(x.text)}</p></article>`).join('')}</div><div class="grid analytics-grid">
      ${analyticsCard('a-score','Score progression',analyticsPattern==='main'?'Main /300 · recent average and weekly ramp':analyticsPattern==='advanced'?'Advanced /'+m.scale+' · independent score scale':'Main /300 and Advanced /'+state.settings.advanced.maxScore+' · separate axes',m.logs.length,'Your next paper starts the trend.')}
      ${analyticsCard('a-subject','Subject score trends','Physics, Chemistry and Maths · '+(analyticsPattern==='all'?'% of subject maximum':'/'+m.subjectScale),m.logs.some(a=>Object.keys(a.subjects).length),'Add subject marks to reveal this pattern’s balance.')}
      ${analyticsCard('a-percentile','Reported percentile','Only manually entered provider or official results',m.logs.some(a=>a.percentile!==null&&a.percentile!==undefined),'No reported percentiles yet.')}

      ${analyticsCard('a-errors','Mistake categories','Attempted questions · open and resolved entries',m.errors.length,'Log the errors behind your marks.')}
      ${analyticsCard('a-skips','Why questions were skipped','Unattempted question counts · open entries',m.skips.some(k=>!k.resolved),'Record skipped questions and reasons.')}
      ${analyticsCard('a-weak','Chapters needing repair','Top 8 · open mistakes plus open skipped questions',m.weak.length,'Your repair list is clear.')}
      ${analyticsCard('a-time','Time taken versus score','Each point is an attempt; this does not establish causation',m.logs.length,'Time and score will appear together.')}
      ${analyticsCard('a-revision','Revision milestones','Current chapter percentages by subject · snapshot',eligible.length,'Start tracking chapter milestones.')}
      ${analyticsCard('a-pyq','PYQ coverage by year','Weighted PYQ readiness · Practised ½ / Mastered 1 · ignored years excluded',activeYears().length,'Choose at least one PYQ year.')}
      ${analyticsCard('a-study','Study time by day',`Latest ${analyticsRange==='all'?30:Number(analyticsRange)} days · hours and current daily goal`,state.studySessions.length,'Log your first study session.')}
      ${analyticsCard('a-habits','Habit consistency','Completion rate in the displayed period · today included',state.habits.some(h=>!h.archived),'Add a daily habit in the Study tab.')}
      ${analyticsCard('a-accuracy','Attempt accuracy by subject','Correct / attempted · strategy-logged attempts only',m.logs.some(a=>a.strategy),'Add detailed attempt counts.')}
      ${analyticsCard('a-opportunity','Negatives & skipped opportunity','Raw mark totals · count-based upper bounds, not predictions',m.logs.some(a=>a.strategy),'Log marking rules and attempt counts.')}
    </div><div class="footer-note">Small samples can be noisy. Insights describe your logs; they do not predict percentile, rank or exam results.</div>`}
  function renderAnalyticsCharts(){
    if(!window.Chart){document.querySelectorAll('.analytics-chart').forEach(node=>node.innerHTML=empty('trend','Charts need an internet connection.','Your entries and text insights remain available.'));return}
    const m=analyticsModel(),colors=['#9abefa','#c7b2fa','#d4f58a'],labels=m.logs.map(a=>fmtDate(a.date,{day:'numeric',month:'short'}));
    Chart.defaults.color='#9aa79c';Chart.defaults.font.family='-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';Chart.defaults.font.size=10;
    const common={responsive:true,maintainAspectRatio:false,animation:matchMedia('(prefers-reduced-motion: reduce)').matches?false:{duration:250},plugins:{legend:{position:'bottom',labels:{boxWidth:9,boxHeight:9,usePointStyle:true,padding:15}},tooltip:{backgroundColor:'#253221',titleColor:'#f0f4ed',bodyColor:'#cbd6c5',padding:12}},scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:7},border:{display:false}},y:{grid:{color:'#ffffff09'},border:{display:false},beginAtZero:true}}};
    const line=(label,data,color,extra={})=>({label,data,borderColor:color,backgroundColor:color,pointRadius:3,pointHoverRadius:5,borderWidth:2,tension:.2,...extra});
    const make=(id,type,data,options={})=>{if($(id))activeCharts.push(new Chart($(id),{type,data,options:{...common,...options}}))};
    renderRampScoreChart('a-score',m.logs,common,analyticsPattern==='main');
    const subjectGroups=analyticsPattern==='all'?[['Main',true],['Advanced',false]]:[[analyticsPattern==='advanced'?'Advanced':'Main',null]];make('a-subject','line',{labels,datasets:subjectGroups.flatMap(([label,main])=>SUBJECTS.map((sub,i)=>line(label+' '+sub+(analyticsPattern==='all'?' (%)':''),m.logs.map(a=>a.subjects[sub]&&(main===null||isMain(testById(a.testId))===main)?a.subjects[sub].score/a.subjects[sub].max*m.subjectScale:null),colors[i],{spanGaps:true,...(label==='Advanced'?{borderDash:[5,4]}:{})})))},{scales:{...common.scales,y:{...common.scales.y,suggestedMax:m.subjectScale}}});
    const perc=m.logs.filter(a=>a.percentile!==null&&a.percentile!==undefined);make('a-percentile','line',{labels:perc.map(a=>fmtDate(a.date,{day:'numeric',month:'short'})),datasets:[line('Reported %ile',perc.map(a=>a.percentile),'#c7b2fa')]},{scales:{...common.scales,y:{...common.scales.y,min:0,max:100}}});
    const families=['STAR Score','Normal / ALLEN','2026 Papers','My Tests'],familiesWithPatterns=analyticsPattern==='all'?families.flatMap(family=>[['Main',true],['Advanced',false]].map(([pattern,main])=>({label:family+' · '+pattern,logs:m.logs.filter(a=>seriesGroup(testById(a.testId))===family&&isMain(testById(a.testId))===main)}))):families.map(family=>({label:family,logs:m.logs.filter(a=>seriesGroup(testById(a.testId))===family)})),familyScores=familiesWithPatterns.map(f=>f.logs.map(a=>a.score/a.total*m.scale));make('a-series','bar',{labels:familiesWithPatterns.map(f=>f.label),datasets:[{label:'Average · '+m.label,data:familyScores.map(mean),backgroundColor:'#d4f58a',borderRadius:4},{label:'Best · '+m.label,data:familyScores.map(x=>x.length?Math.max(...x):null),backgroundColor:'#8aa17b',borderRadius:4}]});
    make('a-errors','doughnut',{labels:['Concept gap','Calculation','Misread / silly','Time / skipped'],datasets:[{data:ERROR_TYPES.map(type=>m.errors.filter(e=>e.type===type).length),backgroundColor:['#ff948d','#e8be79','#c7b2fa','#9abefa'],borderColor:'#171e19',borderWidth:4}]},{scales:undefined,cutout:'68%'});
    make('a-skips','bar',{labels:['Concept gap','Calculation','Uncertain approach','Time ran out','Too lengthy','Not tried','Other'],datasets:[{label:'Open skipped Qs',data:SKIP_REASONS.map(r=>m.skips.filter(k=>!k.resolved&&k.reason===r).reduce((n,k)=>n+k.count,0)),backgroundColor:'#e8be79',borderRadius:4}]},{indexAxis:'y',scales:{x:{...common.scales.y,ticks:{precision:0}},y:{...common.scales.x}}});
    const weak=m.weak.slice(0,8);make('a-weak','bar',{labels:weak.map(x=>x.chapter.name.length>28?x.chapter.name.slice(0,27)+'…':x.chapter.name),datasets:[{label:'Open questions',data:weak.map(x=>x.count),backgroundColor:weak.map(x=>x.concepts>=state.settings.conceptThreshold?'#ff948d':'#e8be79'),borderRadius:4}]},{indexAxis:'y',scales:{x:{...common.scales.y,ticks:{precision:0}},y:{...common.scales.x}},plugins:{...common.plugins,tooltip:{...common.plugins.tooltip,callbacks:{title:items=>weak[items[0].dataIndex].chapter.name}}}});
    const timeGroups=analyticsPattern==='all'?[['Main',m.mainLogs,'#9abefa'],['Advanced',m.advancedLogs,'#c7b2fa']]:[[analyticsPattern==='advanced'?'Advanced':'Main',m.logs,'#9abefa']];make('a-time','scatter',{datasets:timeGroups.map(([label,logs,color])=>({label,data:logs.map(a=>({x:a.minutes,y:a.score/a.total*m.scale,testName:testById(a.testId).name})),backgroundColor:color,pointRadius:5}))},{scales:{x:{...common.scales.y,title:{display:true,text:'Minutes'}},y:{...common.scales.y,title:{display:true,text:m.label}}},plugins:{...common.plugins,tooltip:{...common.plugins.tooltip,callbacks:{label:c=>c.raw.testName+': '+c.raw.x+' min · '+c.raw.y.toFixed(1)+m.unit}}}});
    const eligible=CHAPTERS.filter(c=>!c.legacy),subjectChapters=SUBJECTS.map(s=>eligible.filter(c=>c.subject===s));make('a-revision','bar',{labels:['Physics','Chemistry','Maths'],datasets:[['notes','Notes','#9abefa'],['short','Short notes','#c7b2fa'],['revision','1st revision','#d4f58a']].map(([key,label,color])=>({label,data:subjectChapters.map(cs=>cs.length?cs.filter(c=>progressOf(c.id)[key]).length/cs.length*100:0),backgroundColor:color,borderRadius:4}))},{scales:{...common.scales,y:{...common.scales.y,max:100,ticks:{callback:v=>v+'%'}}}});
    const years=activeYears();make('a-pyq','bar',{labels:years,datasets:SUBJECTS.map((s,i)=>({label:s,data:years.map(y=>subjectChapters[i].length?subjectChapters[i].reduce((n,c)=>n+pyqWeight(progressOf(c.id),y),0)/subjectChapters[i].length*100:0),backgroundColor:colors[i],borderRadius:3}))},{scales:{...common.scales,y:{...common.scales.y,max:100,ticks:{callback:v=>v+'%'}}}});

    const count=analyticsRange==='all'?30:Number(analyticsRange),dates=Array.from({length:count},(_,i)=>offsetDay(today(),i-count+1));make('a-study','bar',{labels:dates.map(d=>fmtDate(d,{day:'numeric',month:'short'})),datasets:[{label:'Study hours',data:dates.map(d=>studyMinutes(d)/60),backgroundColor:'#d4f58a',borderRadius:3},{type:'line',...line('Current daily goal',dates.map(()=>state.settings.dailyStudyGoal/60),'#9abefa',{pointRadius:0,borderDash:[4,4],borderWidth:1})}]},{scales:{...common.scales,y:{...common.scales.y,title:{display:true,text:'Hours'}}}});
    const habits=state.habits.filter(h=>!h.archived),rates=habits.map(h=>{const eligible=dates.filter(d=>d>=h.startDate);return eligible.length?h.days.filter(d=>eligible.includes(d)).length/eligible.length*100:0});make('a-habits','bar',{labels:habits.map(h=>h.name),datasets:[{label:'Days completed',data:rates,backgroundColor:habits.map((_,i)=>colors[i%3]),borderRadius:4}]},{indexAxis:'y',scales:{x:{...common.scales.y,max:100,ticks:{callback:v=>v+'%'}},y:{...common.scales.x}}});
  }

  function renderStudyDay(){
    const entries=state.studySessions.filter(x=>x.date===studyDate).slice().reverse(),minutes=studyMinutes(studyDate),habits=state.habits.filter(h=>!h.archived),eligible=habits.filter(h=>h.startDate<=studyDate),done=eligible.filter(h=>h.days.includes(studyDate)).length,days=studyDays();
    const todos=state.todos.filter(x=>(todoSubject==='all'||(x.subject||'General')===todoSubject)&&(todoCategory==='all'||(x.category||'General')===todoCategory)).filter(x=>todoFilter==='all'||(todoFilter==='done'?x.done:!x.done)).slice().sort((a,b)=>Number(a.done)-Number(b.done)||({high:0,normal:1,low:2}[a.priority]-{high:0,normal:1,low:2}[b.priority])||(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
    return header('Build your daily rhythm.','Focused study, daily habits and one clear next action.',`<button class="btn" data-action="log-study">${icon('plus')}Log study</button>`)+`<div class="toolbar">${studyViewSwitch()}<label class="small muted" for="study-date">Day to review</label><input id="study-date" type="date" max="${today()}" value="${studyDate}" style="width:auto"><button class="btn ghost compact" data-action="study-today">Today</button><button class="btn secondary compact" data-action="study-goal">Daily goal · ${displayMinutes(state.settings.dailyStudyGoal)}</button></div><div class="grid metrics">${metric('clock','Study this day',displayMinutes(minutes),`${Math.round(minutes/state.settings.dailyStudyGoal*100)}% of your current daily goal`)}${metric('fire','Current study streak',dayStreak(days)+'<span>'+ (dayStreak(days)===1?'day':'days')+'</span>',`Best ${longestStreak(days)} day${longestStreak(days)===1?'':'s'} · any logged study counts`)}${metric('check','Habits this day',done+'<span>/ '+eligible.length+'</span>',`${habits.length} active habits · check the day you completed them`)}${metric('test','Open to-dos',state.todos.filter(x=>!x.done).length,'Keep the next action small and specific')}</div>${reminderSummary()}<div class="grid study-layout"><div class="stack"><section class="card"><div class="sectionhead"><div><h2>Daily habits</h2><p class="small muted" style="margin-top:6px">${fmtDate(studyDate)} · each habit has its own streak</p></div><button class="textbutton" data-action="add-habit">${icon('plus')}Add habit</button></div>${habits.length?habits.map(h=>habitRow(h)).join(''):empty('check','Choose one habit to start.','Add something you can repeat every day.')}<div class="habit-day-link flexrow between wrap"><button class="textbutton" data-action="study-view" data-value="habits">Consistency heatmap ${icon('arrow')}</button><button class="textbutton" data-action="manage-habits">Manage archived habits ${icon('arrow')}</button></div></section><section class="card"><div class="sectionhead"><h2>Your study week</h2><button class="textbutton" data-action="navigate" data-view="analytics">See analytics ${icon('arrow')}</button></div><div class="week">${Array.from({length:7},(_,i)=>{const d=offsetDay(today(),i-6),n=studyMinutes(d);return `<div class="day ${n?'done':''} ${d===today()?'today':''}" title="${d}: ${n} minutes"><i>${n?displayMinutes(n):'—'}</i>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})}</div>`}).join('')}</div><p class="hint" style="margin-top:20px">Study streaks count consecutive calendar days with at least one saved study session. Habit streaks are separate. Revision and Active recall sessions also count toward your dashboard revision streak.</p></section></div><section class="card"><div class="sectionhead"><div><h2>Mini to-do list</h2><p class="small muted" style="margin-top:6px">One small action beats a vague intention.</p></div><span class="badge">${state.todos.filter(x=>!x.done).length} open</span></div><form id="todo-add-form">${todoFields()}<div class="flexrow"><input name="text" maxlength="200" required placeholder="Your next action…" aria-label="New to-do" class="grow"><button type="submit" class="btn compact">Add</button></div><details class="coverage"><summary>Optional due date & priority</summary><div class="form-grid"><div><label class="label" for="todo-due">Due date</label><input id="todo-due" name="dueDate" type="date"></div><div><label class="label" for="todo-priority">Priority</label><select id="todo-priority" name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></div></div></details></form><div class="segmented" style="margin:16px 0;width:100%">${[['open','Open'],['done','Done'],['all','All']].map(([value,label])=>`<button class="${todoFilter===value?'active':''}" data-action="todo-filter" data-value="${value}">${label}</button>`).join('')}</div>${todoFilters()}<div>${todos.length?todos.map(todoRow).join(''):empty('check',todoFilter==='done'?'Completed tasks will live here.':'Your list is clear.','Add a specific action when you need one.')}</div></section></div><section class="card" style="margin-top:20px"><div class="sectionhead"><div><h2>Study log</h2><p class="small muted" style="margin-top:6px">${fmtDate(studyDate)} · ${entries.length} session${entries.length===1?'':'s'} · ${displayMinutes(minutes)}</p></div><button class="btn secondary compact" data-action="log-study">${icon('plus')}Add session</button></div>${entries.length?entries.map(x=>`<article class="session-log"><div class="flexrow between wrap"><div><h3 style="margin:0">${esc(x.subject)}${x.chapterId?' · '+esc(chapterById(x.chapterId).name):''}</h3><p class="hint">${displayMinutes(x.minutes)} · ${esc(x.mode)} · ${x.track==='advanced'?'Advanced':'Main'}</p></div><div class="flexrow"><button class="textbutton" data-action="edit-study" data-id="${x.id}">Edit</button><button class="iconbtn" data-action="delete-study" data-id="${x.id}" aria-label="Delete ${esc(x.subject)} study session">${icon('trash')}</button></div></div>${x.note?`<p class="small muted" style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px">${esc(x.note)}</p>`:''}</article>`).join(''):empty('book','No study sessions for this day.','Log the work you actually completed. No timer is required.')}</section>`;
  }
  function habitRow(h){const selected=h.days.includes(studyDate),started=studyDate>=h.startDate;return `<article class="habit-row"><div class="flexrow between"><label class="checklabel grow"><input type="checkbox" data-habit-check="${h.id}" ${selected?'checked':''} ${started?'':'disabled'}><span><b style="color:var(--text);font-weight:550">${esc(h.name)}</b><span class="hint" style="display:block">${started?'Current '+dayStreak(h.days)+' day'+(dayStreak(h.days)===1?'':'s')+' · best '+longestStreak(h.days)+' day'+(longestStreak(h.days)===1?'':'s'):'Starts '+fmtDate(h.startDate)}</span></span></label><button class="textbutton" data-action="edit-habit" data-id="${h.id}">Edit</button></div><div class="habit-week">${Array.from({length:7},(_,i)=>{const d=offsetDay(today(),i-6);return `<span class="habit-day ${h.days.includes(d)?'done':''}" title="${d}: ${h.days.includes(d)?'completed':'not checked'}">${h.days.includes(d)?'✓':new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'}).slice(0,1)}</span>`}).join('')}</div></article>`}
  function todoRow(x){return `<article class="todo-row"><label class="checklabel grow"><input type="checkbox" data-todo-check="${x.id}" ${x.done?'checked':''}><span style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.text)}<span class="hint" style="display:block">${esc(x.subject||'General')} · ${esc(x.category||'General')} · ${x.priority==='high'?'<span style="color:var(--red)">High priority</span>':x.priority==='low'?'Low priority':'Normal'}${x.dueDate?' · Due '+fmtDate(x.dueDate):''}${!x.done&&x.dueDate&&x.dueDate<today()?' · <span class="danger">Overdue</span>':''}</span></span></label><button class="iconbtn" data-action="edit-todo" data-id="${x.id}" aria-label="Edit to-do">${icon('book')}</button><button class="iconbtn" data-action="delete-todo" data-id="${x.id}" aria-label="Delete to-do">${icon('trash')}</button></article>`}
  function studyChapterOptions(subject,chosen=''){return '<option value="">No specific chapter</option>'+CHAPTERS.filter(c=>c.subject===subject).map(c=>`<option value="${c.id}" ${c.id===chosen?'selected':''}>${esc(c.name)}</option>`).join('')}
  function studyEditor(id=''){const x=state.studySessions.find(x=>x.id===id),subject=x?.subject||'Physics';openModal(x?'Edit study session':'Log a study session',`<p class="small muted" style="margin-bottom:20px">Record focused minutes you completed. This updates study time and study streaks; Revision and Active recall modes also count as revision days.</p><form id="study-form" data-edit-id="${id}"><div class="form-grid"><div><label class="label" for="study-log-date">Study date</label><input id="study-log-date" type="date" name="date" max="${today()}" value="${x?.date||studyDate}" required></div><div><label class="label" for="study-minutes">Focused minutes</label><input id="study-minutes" type="number" name="minutes" min="1" max="720" step="1" value="${x?.minutes||60}" required></div><div><label class="label" for="study-subject">Subject</label><select id="study-subject" name="subject">${STUDY_SUBJECTS.map(s=>`<option ${s===subject?'selected':''}>${s}</option>`).join('')}</select></div><div><label class="label" for="study-mode">Study activity</label><select id="study-mode" name="mode">${STUDY_MODES.map(s=>`<option ${s===(x?.mode||'Revision')?'selected':''}>${s}</option>`).join('')}</select></div><div><label class="label" for="study-track">Preparation track</label><select id="study-track" name="track"><option value="main" ${x?.track!=='advanced'?'selected':''}>Main</option><option value="advanced" ${x?.track==='advanced'?'selected':''}>Advanced · alongside or after Main</option></select></div><div class="full"><label class="label" for="study-chapter">Chapter (optional)</label><select id="study-chapter" name="chapterId">${studyChapterOptions(subject,x?.chapterId||'')}</select></div><div class="full"><label class="label" for="study-note">What did you complete?</label><textarea id="study-note" name="note" maxlength="2000" placeholder="Topics revised, PYQs solved or an important next step…">${esc(x?.note||'')}</textarea></div></div><div id="form-error" class="error-msg" r
